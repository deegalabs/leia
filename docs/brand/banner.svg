  <g transform="translate(96 108) scale(2.2)">
    <rect x="10" y="6" width="34" height="46" rx="6" fill="none" stroke="#F0F0E8" stroke-width="4"/>
    <path d="M18 18h18M18 27h18M18 36h12" fill="none" stroke="#F0F0E8" stroke-width="4" stroke-linecap="round"/>
