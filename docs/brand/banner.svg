      <stop offset="0" stop-color="#081820"/>
      <stop offset="1" stop-color="#0F2431"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38A8A8"/>
      <stop offset="1" stop-color="#38A8A8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#ground)"/>
