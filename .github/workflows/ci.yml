name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    name: service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/llm-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/llm-service/requirements*.txt
      - name: install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: test
        run: python -m pytest -q
      - name: evals
        run: python -m evals.run

  web:
    name: web (vitest, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # A versão vem do "packageManager" do package.json da raiz. Declarar aqui também faz a action
      # abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: lint
        run: pnpm lint
      - name: build
        run: pnpm build
