  <defs>
    <!-- Degradê SUAVE e HARMÔNICO (Bronze Envelhecido) para o preenchimento -->
    <linearGradient id="ouroHarmonioso" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#Af7844"/>
      <stop offset="50%"  stop-color="#7A5210"/>
      <stop offset="100%" stop-color="#503B00"/>
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dx="25" dy="25" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grupo principal -->
  <!-- 
       Mudanças na borda:
       - stroke: cor sólida parecida com a das caixas (#A87B1C)
       - stroke-width: reduzido de 40 para 12 (fica ~1.2px na escala final)
       - stroke-opacity: 0.6 para dar o efeito translúcido das caixas
  -->
