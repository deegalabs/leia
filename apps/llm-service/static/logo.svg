     width="2400pt" height="900pt" viewBox="0 -50 2400 1050"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Degradê dourado para o PREENCHIMENTO -->
    <linearGradient id="ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF2B0"/>
      <stop offset="25%"  stop-color="#F5C542"/>
      <stop offset="50%"  stop-color="#D4A017"/>
      <stop offset="75%"  stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7E5000"/>
    </linearGradient>

    <!-- Degradê dourado para a BORDA -->
    <linearGradient id="bordaOuro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE97F"/>
      <stop offset="50%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#5C3A00"/>
    </linearGradient>

    <!-- Filtro de SOMBRA (Ajustado para a escala 0.1) -->
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="40"/>
      <feOffset dx="20" dy="20" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grupo principal com a transformação corrigida -->
  <g transform="translate(0, 850) scale(0.1, -0.1)"
     fill="url(#ouro)"
     stroke="url(#bordaOuro)"
     stroke-width="40"
     stroke-linejoin="round"
     filter="url(#sombra)">
    
