<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preparando seu documento…</title>
<meta http-equiv="refresh" content="5">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@300;400;500&display=swap');
  :root{
    --bg:#0b0d14;--gold:#c9a84c;--gold-lt:#e8cf82;
    --tx:#dde1ed;--tx3:#424660;--sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 55% at 50% -8%,rgba(201,168,76,.07) 0,transparent 60%),var(--bg);
    color:var(--tx);font-family:var(--sans);padding:24px;text-align:center;
  }
  .box{max-width:420px}
  h1{font-family:'Cormorant Garamond',serif;color:var(--gold-lt);font-weight:500;
     font-size:1.5rem;margin-bottom:8px}
  p{color:var(--tx3);font-size:.85rem;line-height:1.6}
  .spin{
    width:48px;height:48px;margin:24px auto;border-radius:50%;
    border:3px solid rgba(201,168,76,.15);border-top-color:var(--gold);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{
    font-family:'JetBrains Mono',monospace;font-size:.72rem;
    color:var(--tx3);margin-top:24px;
  }
  .status b{color:var(--gold-lt);font-weight:500}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>Preparando seu documento…</h1>
    <p>Estamos processando a análise do seu caso.<br>
       A página atualizará sozinha em alguns instantes.</p>
    <div class="status">Status: <b>{{ tarefa.status }}</b></div>
  </div>
</body>
</html>
