<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · AI Forensics</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@300;400;500&display=swap');

  :root{
    --bg:#0b0d14;--bg1:#10131c;--bg2:#161a26;--bg3:#1c2133;
    --gold:#c9a84c;--gold-lt:#e8cf82;--gold-bd:rgba(201,168,76,.2);
    --gold-glow:rgba(201,168,76,.11);
    --tx:#dde1ed;--tx2:#8890aa;--tx3:#424660;
    --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);
    --sans:'DM Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
    --err:#f27272;--err-bg:rgba(217,58,58,.14);--err-bd:rgba(217,58,58,.4);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 55% at 50% -8%,rgba(201,168,76,.07) 0,transparent 60%),var(--bg);
    color:var(--tx);font-family:var(--sans);padding:20px;
  }
  .box{
    width:100%;max-width:380px;background:linear-gradient(165deg,var(--bg2),var(--bg1));
    border:1px solid var(--gold-bd);border-radius:18px;padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
  }
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--gold-lt);
     font-size:1.5rem;margin:0 0 4px;text-align:center;letter-spacing:.01em}
  .sub{font-size:.72rem;color:var(--tx3);text-align:center;margin-bottom:22px;font-family:var(--mono);
       letter-spacing:.08em;text-transform:uppercase}
  label{display:block;font-size:.7rem;color:var(--tx3);font-family:var(--mono);
        text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
  input{
    width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;
    padding:11px 14px;color:var(--tx);font-size:.88rem;font-family:var(--sans);outline:none;
  }
  input:focus{border-color:var(--gold-bd)}
  button{
    width:100%;margin-top:20px;padding:12px;border-radius:11px;cursor:pointer;
    background:var(--gold-glow);border:1px solid var(--gold-bd);color:var(--gold-lt);
    font-family:var(--sans);font-size:.85rem;font-weight:600;letter-spacing:.02em;
  }
  button:hover{background:rgba(201,168,76,.22)}
  .err{
    background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err);
    padding:9px 12px;border-radius:9px;font-size:.75rem;margin-bottom:10px;text-align:center;
  }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>AI Forensics</h1>
    <div class="sub">Gestão de Tarefas</div>

    {% if erro %}<div class="err">Credenciais inválidas.</div>{% endif %}

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required autofocus autocomplete="username">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required autocomplete="current-password">

    <button type="submit">Entrar</button>
  </form>
</body>
</html>
