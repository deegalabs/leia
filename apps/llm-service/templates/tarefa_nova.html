<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo documento · LeIA</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@300;400;500&display=swap');


  :root{
    --bg:#0b0d14;--bg1:#10131c;--bg2:#161a26;--bg3:#1c2133;
    --gold:#c9a84c;--gold-lt:#e8cf82;--gold-bd:rgba(201,168,76,.2);
    --gold-glow:rgba(201,168,76,.11);
    --tx:#dde1ed;--tx2:#8890aa;--tx3:#424660;
    --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);
    --sans:'DM Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;
       background:radial-gradient(120% 55% at 50% -8%,rgba(201,168,76,.07) 0,transparent 60%),var(--bg);
       color:var(--tx);font-family:var(--sans);padding:20px}
  .wrap{max-width:680px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);
         padding-bottom:16px;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--gold-lt);
     font-size:1.4rem;margin:0;flex:1}
  a.back{color:var(--tx2);text-decoration:none;font-size:.82rem}
  a.back:hover{color:var(--gold-lt)}
  .card{background:linear-gradient(165deg,var(--bg2),var(--bg1));
        border:1px solid var(--gold-bd);border-radius:16px;padding:22px;
        box-shadow:0 10px 34px rgba(0,0,0,.38)}
  label{display:block;font-size:.7rem;color:var(--tx3);font-family:var(--mono);
        text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
  input[type=text],input[type=file]{
    width:100%;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;
    padding:11px 14px;color:var(--tx);font-size:.88rem;font-family:var(--sans);outline:none;
  }
  input[type=file]{padding:9px 12px;font-size:.78rem;cursor:pointer}
  input:focus{border-color:var(--gold-bd)}
  .field{margin-bottom:18px}
  .hint{font-size:.7rem;color:var(--tx3);margin-top:6px;line-height:1.5}
  button{
    width:100%;margin-top:10px;padding:13px;border-radius:11px;cursor:pointer;
    background:var(--gold-glow);border:1px solid var(--gold-bd);color:var(--gold-lt);
    font-family:var(--sans);font-size:.85rem;font-weight:600;letter-spacing:.02em;
  }
  button:hover{background:rgba(201,168,76,.22)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/dashboard">← Voltar</a>
    <h1>Novo documento</h1>
  </header>

  <form class="card" method="post" action="/tarefas/nova" enctype="multipart/form-data">
    <div class="field">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" type="text" required maxlength="200"
             placeholder="Ex: Intimação 0001234-56.2026 — Autor João Silva">
      <div class="hint">Aparece no painel e no topo do link enviado ao cliente.</div>
    </div>

    <div class="field">
      <label for="pdf">PDF</label>
      <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required>
      <div class="hint">
        O PDF é salvo numa pasta única <code style="color:var(--gold-lt)">workspace/{hash}/</code>
        com hash URL-safe inatingível por adivinhação. Todo passo da pipeline é registrado em
        <code style="color:var(--gold-lt)">log.jsonl</code>.
      </div>
    </div>

    <button type="submit">Criar tarefa e gerar hash →</button>
  </form>
</div>
</body>
</html>
